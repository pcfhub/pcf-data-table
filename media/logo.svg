<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A table: a header row you can sort by, and cells in two columns under it.

       The header is the whole distinction. pcf-compact-list is the same records
       with no frame and no header, because it is the one for narrow spaces;
       this is the one with columns, so the mark has to show a column boundary
       and something to click at the top of it.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. The body cells are held at 0.55 so the header stays the
       first thing read at every size; at full white the mark flattened into six
       equal bars and stopped being a table.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="data-table-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The frame. -->
  <rect x="6" y="14" width="84" height="68" rx="16" fill="url(#data-table-ramp)"/>

  <!-- The header row. -->
  <rect x="17" y="26" width="62" height="10" rx="5" fill="#F8FAFC"/>

  <!-- Two columns of cells, held back so the header leads. -->
  <rect x="17" y="46" width="26" height="9" rx="4.5" fill="#F8FAFC" fill-opacity="0.55"/>
  <rect x="53" y="46" width="26" height="9" rx="4.5" fill="#F8FAFC" fill-opacity="0.55"/>
  <rect x="17" y="62" width="26" height="9" rx="4.5" fill="#F8FAFC" fill-opacity="0.55"/>
  <rect x="53" y="62" width="26" height="9" rx="4.5" fill="#F8FAFC" fill-opacity="0.55"/>
</svg>
